<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200"><title>平台登入與儲存設定</title><desc>純設計稿，帳戶、時間、數字及登入狀態皆為示例，未執行下載。</desc><defs><style>:root{--bg:#1E1E2E;--fg:#CDD6F4;--accent:#FF007F;--surface:#313244;--muted:#A6ADC8;--border:#45475A;--ok:#A6E3A1;--warn:#F9E2AF}text{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--fg);font-size:15px}.h{font-size:19px;font-weight:650}.title{font-size:27px;font-weight:650}.muted{fill:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.ok{fill:var(--ok)}.warn{fill:var(--warn)}.accent{fill:var(--accent)}.button-primary{fill:#11111B;font-weight:700}.disabled{fill:#7F849C}.bold{font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}</style></defs><rect x="0" y="0" width="1240" height="1200" rx="0" fill="#1E1E2E"/><rect x="0" y="0" width="1240" height="58" rx="0" fill="#181825"/><circle cx="28" cy="28" r="6" fill="#F38BA8"/><circle cx="49" cy="28" r="6" fill="#F9E2AF"/><circle cx="70" cy="28" r="6" fill="#A6E3A1"/><text x="113" y="35" class="h">SNS Downloader</text><text x="674" y="35" class="muted">備份帳戶</text><text x="816" y="35" class="muted">已下載內容</text><rect x="956" y="12" width="90" height="34" rx="8" fill="#313244"/><text x="970" y="35" class="">設定</text><text x="1090" y="35" class="muted small">繁中 / 日本語</text><text x="28" y="108" class="title">設定</text><text x="28" y="140" class="muted">預設先嘗試免登入；需要時由你喺獨立網站視窗登入。</text><rect x="28" y="162" width="1184" height="270" rx="10" fill="#181825" stroke="#45475A"/><text x="48" y="198" class="h">平台登入身份</text><text x="48" y="228" class="muted small">每平台一個登入身份，可備份多個目標帳戶；登入成功唔會自動開始更新。</text><text x="48" y="268" class="h">X</text><text x="48" y="298" class="small">已驗證可用（示例）</text><text x="48" y="326" class="muted small">登入身份：@example_login</text><rect x="48" y="347" width="156" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="60" y="371" class="">開啟登入視窗</text><text x="48" y="408" class="muted small">重新檢查  /  清除登入資料</text><text x="444" y="268" class="h">Instagram</text><text x="444" y="298" class="small">未登入 · 可以先嘗試匿名</text><text x="444" y="326" class="muted small">登入身份：未設定</text><rect x="444" y="347" width="156" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="456" y="371" class="">開啟登入視窗</text><text x="444" y="408" class="muted small">重新檢查  /  清除登入資料</text><text x="840" y="268" class="h">TikTok</text><text x="840" y="298" class="small">登入資料已取得 · 待驗證</text><text x="840" y="326" class="muted small">登入身份：等待確認</text><rect x="840" y="347" width="156" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="852" y="371" class="">開啟登入視窗</text><text x="840" y="408" class="muted small">重新檢查  /  清除登入資料</text><rect x="28" y="451" width="1184" height="134" rx="10" fill="#181825" stroke="#45475A"/><text x="48" y="487" class="h">備份儲存位置</text><rect x="48" y="502" width="935" height="40" rx="7" fill="#1E1E2E" stroke="#45475A"/><text x="60" y="528" class="">~/Downloads/SNSDownloader</text><rect x="1000" y="504" width="190" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="1012" y="528" class="">選擇其他資料夾</text><text x="48" y="568" class="muted small">更換只影響新下載；舊檔保留原位，可喺內容瀏覽選返舊來源。</text><text x="28" y="633" class="h">登入流程預覽</text><text x="28" y="662" class="warn small">以下係使用流程示意；三平台實際登入與 cookies 交接仍待驗證。</text><rect x="28" y="683" width="698" height="387" rx="12" fill="#181825" stroke="#45475A"/><rect x="29" y="684" width="696" height="48" rx="10" fill="#313244"/><text x="48" y="714" class="h">網站登入視窗 · Instagram</text><rect x="48" y="748" width="658" height="40" rx="7" fill="#1E1E2E" stroke="#45475A"/><text x="60" y="774" class="">https://www.instagram.com/</text><text x="69" y="830" class="h">此處由網站顯示官方登入頁。</text><text x="69" y="870" class="muted">你自己輸入密碼、完成 2FA 或驗證。</text><text x="69" y="900" class="muted">Downloader 唔讀取密碼欄位。</text><text x="69" y="930" class="muted">登入後只擷取此平台嘅登入 cookies。</text><rect x="48" y="1003" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="60" y="1027" class="">取消登入</text><text x="193" y="1027" class="muted small">保留控制權，唔會自動落任何操作。</text><rect x="749" y="683" width="463" height="387" rx="12" fill="#181825" stroke="#45475A"/><text x="769" y="724" class="bold">1  等待你完成網站登入</text><text x="769" y="752" class="muted small">密碼及驗證碼由你手動輸入</text><text x="769" y="804" class="bold">2  登入資料已取得</text><text x="769" y="832" class="muted small">只讀此登入視窗所屬平台嘅 cookies</text><text x="769" y="884" class="bold">3  正在檢查下載存取</text><text x="769" y="912" class="muted small">用下載工具作唯讀驗證，唔憑跳頁判成功</text><text x="769" y="964" class="bold">4  已連接，等待你手動更新</text><text x="769" y="992" class="muted small">安全保存登入，之後過期會再提示</text><text x="28" y="1110" class="muted small">可隨時清除登入資料；本機備份唔會刪除。Cookies 加密存本機，唔寫入備份、日誌或截圖。</text><path d="M24 1161h1192" stroke="#45475A"/><text x="28" y="1185" class="muted small">設計示例 · 所有數字與狀態均為示意，唔代表已實測 · 香港時間 UTC+08:00</text></svg>