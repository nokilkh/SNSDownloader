<svg xmlns="http://www.w3.org/2000/svg" width="640" height="344" viewBox="0 0 640 344" role="img" aria-labelledby="title">
  <title id="title">貼上 X 登入資料對話框</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 15px; fill: #CDD6F4; }
    .label { font-size: 14px; }
    .title { font-size: 20px; font-weight: 650; }
    .hint { font-size: 13px; fill: #A6ADC8; }
    .primary { fill: #11111B; font-weight: 650; }
  </style>
  <rect width="640" height="344" rx="14" fill="#1E1E2E"/>
  <rect x="16" y="16" width="608" height="312" rx="14" fill="#181825" stroke="#45475A"/>
  <text class="title" x="40" y="59">貼上 X 登入資料</text>
  <text class="hint" x="40" y="89">喺已登入 X 嘅 Chrome 複製兩個 Cookie 嘅 Value，再分開貼到下面。</text>
  <text class="label" x="40" y="135">auth_token</text>
  <rect x="40" y="145" width="560" height="39" rx="8" fill="#1E1E2E" stroke="#FF007F"/>
  <text x="52" y="170">••••••••</text>
  <text class="label" x="40" y="213">ct0</text>
  <rect x="40" y="223" width="560" height="39" rx="8" fill="#1E1E2E" stroke="#45475A"/>
  <rect x="40" y="278" width="122" height="34" rx="8" fill="#FF007F"/>
  <text class="primary" x="52" y="300">儲存並試讀</text>
  <rect x="170" y="278" width="60" height="34" rx="8" fill="#313244" stroke="#45475A"/>
  <text x="186" y="300">取消</text>
</svg>
