<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1370" viewBox="0 0 1240 1370"><title>整篇貼文與舊版本</title><desc>純設計稿，帳戶、時間、數字及登入狀態皆為示例，未執行下載。</desc><defs><style>:root{--bg:#1E1E2E;--fg:#CDD6F4;--accent:#FF007F;--surface:#313244;--muted:#A6ADC8;--border:#45475A;--ok:#A6E3A1;--warn:#F9E2AF}text{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--fg);font-size:15px}.h{font-size:19px;font-weight:650}.title{font-size:27px;font-weight:650}.muted{fill:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.ok{fill:var(--ok)}.warn{fill:var(--warn)}.accent{fill:var(--accent)}.button-primary{fill:#11111B;font-weight:700}.disabled{fill:#7F849C}.bold{font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}</style></defs><rect x="0" y="0" width="1240" height="1370" rx="0" fill="#1E1E2E"/><rect x="0" y="0" width="1240" height="58" rx="0" fill="#181825"/><circle cx="28" cy="28" r="6" fill="#F38BA8"/><circle cx="49" cy="28" r="6" fill="#F9E2AF"/><circle cx="70" cy="28" r="6" fill="#A6E3A1"/><text x="113" y="35" class="h">SNS Downloader</text><text x="674" y="35" class="muted">備份帳戶</text><rect x="802" y="12" width="142" height="34" rx="8" fill="#313244"/><text x="816" y="35" class="">已下載內容</text><text x="970" y="35" class="muted">設定</text><text x="1090" y="35" class="muted small">繁中 / 日本語</text><text x="28" y="108" class="title">貼文詳情</text><text x="28" y="139" class="muted">X / MomokoHashimoto / 2024 / 08 / 2024-08-27</text><rect x="1036" y="92" width="176" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="1048" y="116" class="">返回內容瀏覽</text><rect x="28" y="161" width="1184" height="1128" rx="12" fill="#181825" stroke="#45475A"/><text x="50" y="198" class="h">橋本桃呼  @MomokoHashimoto</text><text x="50" y="228" class="muted small">發布：2024-08-27 21:08（香港時間）</text><text x="50" y="258" class="muted small">原文連結    /    開啟資料夾    /    另存整篇</text><rect x="831" y="181" width="355" height="40" rx="7" fill="#1E1E2E" stroke="#45475A"/><text x="843" y="207" class="">最新版本 · 17/11 21:10   ▾</text><text x="831" y="250" class="muted small">文字／ALT 改變時才保留新版本</text><text x="50" y="304" class="h">貼文文字</text><text x="50" y="340" class="muted">［貼文原文在此顯示。］</text><text x="50" y="368" class="muted">保留文字段落、連結及 emoji；呢張設計稿未複製完整原文。</text><rect x="50" y="400" width="699" height="256" rx="9" fill="#313244"/><path d="M243 612L337 477L398 548L452 493L557 612Z" fill="#45475A"/><text x="286" y="638" class="muted small">圖片 1 · 最高可取得原檔</text><text x="50" y="692" class="h">ALT · 圖片 1 原文</text><text x="50" y="728" class="muted">［第一段原始 ALT。］</text><text x="50" y="753" class="muted"></text><text x="50" y="778" class="muted">［第二段原始 ALT。］</text><text x="50" y="803" class="muted">保留原始空行；長文字會自然向下延伸，唔會強制截斷。</text><rect x="50" y="840" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="62" y="864" class="">複製 ALT</text><rect x="194" y="840" width="152" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="206" y="864" class="">另存圖片原檔</text><rect x="50" y="903" width="699" height="184" rx="9" fill="#313244"/><text x="262" y="996" class="muted">圖片 2 或影片播放器</text><text x="50" y="1126" class="h">ALT · 圖片 2</text><text x="50" y="1161" class="warn">未能取得 · 只重試呢張圖嘅 ALT，唔重下載完整圖片。</text><rect x="50" y="1190" width="145" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="62" y="1214" class="">重試缺少資料</text><rect x="778" y="288" width="408" height="363" rx="9" fill="#1E1E2E" stroke="#45475A"/><text x="798" y="324" class="h">版本選擇展開示例</text><rect x="792" y="344" width="380" height="62" rx="7" fill="#313244"/><text x="806" y="370" class="">● 最新 · 17/11 21:10</text><text x="806" y="391" class="muted small">貼文文字更新</text><text x="806" y="440" class="">舊版本 · 16/11 20:08</text><text x="806" y="467" class="muted small">圖片 1 ALT 更新</text><text x="806" y="514" class="">首次保存 · 15/11 19:32</text><text x="806" y="541" class="muted small">觀察時間，唔係網站修改時間</text><text x="798" y="612" class="muted small">只供查看，唔自動還原或改寫網站。</text><rect x="778" y="675" width="408" height="190" rx="9" fill="#1E1E2E" stroke="#45475A"/><text x="798" y="711" class="h">查看舊版本時</text><text x="798" y="747" class="muted">你正查看 16/11 20:08 保存嘅版本。</text><text x="798" y="774" class="muted">文字同 ALT 顯示該次保存內容，</text><text x="798" y="801" class="muted">媒體關聯亦跟隨該版本。</text><rect x="798" y="813" width="156" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="810" y="837" class="">返回最新版本</text><rect x="778" y="887" width="408" height="247" rx="9" fill="#1E1E2E" stroke="#45475A"/><text x="798" y="923" class="h">缺檔／來源失效狀態</text><text x="798" y="959" class="muted small">缺檔：顯示原本媒體位置及重試入口。</text><text x="798" y="988" class="muted small">低畫質：顯示實際尺寸，提供補高畫質。</text><text x="798" y="1017" class="muted small">來源暫不可用：仍可睇本機備份。</text><text x="798" y="1046" class="muted small">來源冇提供 ALT 同讀取失敗分開顯示。</text><text x="798" y="1100" class="muted small">此處係狀態示例，唔係樣本貼文結果。</text><path d="M24 1331h1192" stroke="#45475A"/><text x="28" y="1355" class="muted small">設計示例 · 原文、媒體及 ALT 使用佔位內容；版本時間及尺寸唔代表已下載結果</text></svg>