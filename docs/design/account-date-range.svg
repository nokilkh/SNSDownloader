<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-labelledby="title">
  <title id="title">帳戶備份範圍與開始和結束日期</title>
  <style>
    text { font: 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; fill: #CDD6F4; }
    .heading { font-size: 20px; font-weight: 650; }
    .hint { font-size: 13px; fill: #A6ADC8; }
    .primary { fill: #11111B; font-weight: 650; }
    .outline { fill: #1E1E2E; stroke: #45475A; }
  </style>
  <rect width="680" height="450" rx="14" fill="#1E1E2E"/>
  <rect x="20" y="20" width="640" height="410" rx="14" fill="#181825" stroke="#45475A"/>
  <text class="heading" x="44" y="57">範圍設定</text>
  <text x="44" y="93" font-weight="650">備份範圍</text>
  <circle cx="53" cy="124" r="8" class="outline"/><text x="72" y="129">全部可取得內容</text>
  <circle cx="53" cy="157" r="8" class="outline"/><text x="72" y="162">指定日期之後</text>
  <circle cx="53" cy="190" r="8" fill="#1E1E2E" stroke="#FF007F"/>
  <circle cx="53" cy="190" r="4" fill="#FF007F"/><text x="72" y="195">指定日期範圍</text>
  <text class="hint" x="72" y="230">開始日期</text>
  <text class="hint" x="342" y="230">結束日期</text>
  <rect x="72" y="242" width="254" height="41" rx="8" fill="#1E1E2E" stroke="#FF007F"/>
  <rect x="342" y="242" width="254" height="41" rx="8" class="outline"/>
  <text x="84" y="268">2026-11-01</text>
  <text x="354" y="268">2026-11-22</text>
  <g fill="none" stroke="#A6ADC8" stroke-width="1.5">
    <rect x="297" y="255" width="15" height="14" rx="2"/>
    <path d="M297 260h15m-11-7v4m7-4v4"/>
    <rect x="567" y="255" width="15" height="14" rx="2"/>
    <path d="M567 260h15m-11-7v4m7-4v4"/>
  </g>
  <text class="hint" x="72" y="309">按香港時間計算，開始同結束日期都包括當日。</text>
  <rect x="44" y="357" width="107" height="36" rx="8" fill="#FF007F"/>
  <text class="primary" x="97.5" y="380" text-anchor="middle">儲存帳戶</text>
  <rect x="162" y="357" width="65" height="36" rx="8" fill="#313244" stroke="#45475A"/>
  <text x="194.5" y="380" text-anchor="middle">取消</text>
</svg>
