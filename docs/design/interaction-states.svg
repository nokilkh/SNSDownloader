<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1480" viewBox="0 0 1240 1480"><title>操作回饋與關鍵狀態</title><desc>純設計稿，帳戶、時間、數字及登入狀態皆為示例，未執行下載。</desc><defs><style>:root{--bg:#1E1E2E;--fg:#CDD6F4;--accent:#FF007F;--surface:#313244;--muted:#A6ADC8;--border:#45475A;--ok:#A6E3A1;--warn:#F9E2AF}text{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--fg);font-size:15px}.h{font-size:19px;font-weight:650}.title{font-size:27px;font-weight:650}.muted{fill:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.ok{fill:var(--ok)}.warn{fill:var(--warn)}.accent{fill:var(--accent)}.button-primary{fill:#11111B;font-weight:700}.disabled{fill:#7F849C}.bold{font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}</style></defs><rect x="0" y="0" width="1240" height="1480" rx="0" fill="#1E1E2E"/><rect x="0" y="0" width="1240" height="58" rx="0" fill="#181825"/><circle cx="28" cy="28" r="6" fill="#F38BA8"/><circle cx="49" cy="28" r="6" fill="#F9E2AF"/><circle cx="70" cy="28" r="6" fill="#A6E3A1"/><text x="113" y="35" class="h">SNS Downloader</text><rect x="660" y="12" width="130" height="34" rx="8" fill="#313244"/><text x="674" y="35" class="">備份帳戶</text><text x="816" y="35" class="muted">已下載內容</text><text x="970" y="35" class="muted">設定</text><text x="1090" y="35" class="muted small">繁中 / 日本語</text><text x="28" y="108" class="title">關鍵狀態</text><text x="28" y="139" class="muted">同一套畫面要交代目前狀態、保留咗乜，以及下一步點做。</text><rect x="28" y="165" width="578" height="258" rx="12" fill="#181825" stroke="#45475A"/><text x="48" y="201" class="h">未加入帳戶</text><text x="48" y="234" class="muted">先加入你想備份嘅帳戶。</text><text x="48" y="260" class="muted">平台、日期範圍同儲存位置都可以之後再改。</text><rect x="48" y="352" width="178" height="36" rx="8" fill="#FF007F"/><text x="60" y="376" class="button-primary">新增第一個帳戶</text><rect x="243" y="352" width="166" height="36" rx="8" fill="#313244"/><text x="255" y="376" class="disabled">更新全部帳戶</text><rect x="634" y="165" width="578" height="258" rx="12" fill="#181825" stroke="#45475A"/><text x="654" y="201" class="h">正在更新 · X / @example_creator</text><text x="654" y="234" class="muted">清單仍在取得，總數未確定。</text><text x="654" y="260" class="muted">新增 17 篇貼文 · 跳過 86 個媒體檔 · 2 項待補</text><rect x="654" y="291" width="538" height="5" rx="2" fill="#313244"/><rect x="654" y="291" width="172" height="5" rx="2" fill="#FF007F"/><rect x="654" y="327" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="666" y="351" class="">暫停更新</text><rect x="798" y="327" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="810" y="351" class="">停止更新</text><text x="654" y="395" class="muted small">暫停先停派新工作；正在下載嘅檔案可能先完成。</text><rect x="28" y="441" width="578" height="258" rx="12" fill="#181825" stroke="#45475A"/><text x="48" y="477" class="h">部分完成 · 2 項未完成</text><text x="48" y="510" class="muted">完整圖片同影片已保留。</text><text x="48" y="536" class="muted">1 項缺 ALT，1 項未取得最高畫質。</text><rect x="48" y="628" width="176" height="36" rx="8" fill="#FF007F"/><text x="60" y="652" class="button-primary">只重試缺漏</text><rect x="241" y="628" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="253" y="652" class="">查看原因</text><rect x="634" y="441" width="578" height="258" rx="12" fill="#181825" stroke="#45475A"/><text x="654" y="477" class="h">Instagram 呢個帳戶需要登入</text><text x="654" y="510" class="muted">已保存內容保留，其他可取得帳戶可繼續。</text><text x="654" y="536" class="muted">登入只影響存取能力，唔會自動更新帳戶。</text><rect x="654" y="628" width="178" height="36" rx="8" fill="#FF007F"/><text x="666" y="652" class="button-primary">開啟登入視窗</text><rect x="849" y="628" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="861" y="652" class="">略過此帳戶</text><rect x="28" y="717" width="578" height="258" rx="12" fill="#181825" stroke="#45475A"/><text x="48" y="753" class="h">儲存位置暫時不可用</text><text x="48" y="786" class="muted">NAS 已斷線／資料夾無寫入權限／空間不足。</text><text x="48" y="812" class="muted">已停止受影響工作，唔會偷偷改存其他位置。</text><rect x="48" y="904" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="60" y="928" class="">重新檢查</text><rect x="192" y="904" width="178" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="204" y="928" class="">選擇其他位置</text><text x="48" y="952" class="muted small">修復後由你手動更新／補缺漏，保留已完成檔案。</text><rect x="634" y="717" width="578" height="258" rx="12" fill="#181825" stroke="#45475A"/><text x="654" y="753" class="h">已暫停</text><text x="654" y="786" class="muted">在途檔案已收尾，未派發其他工作。</text><text x="654" y="812" class="muted">可以繼續目前工作，或者停止並保留檔案。</text><rect x="654" y="881" width="128" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="666" y="905" class="">繼續更新</text><rect x="798" y="881" width="154" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="810" y="905" class="">停止並保留檔案</text><text x="654" y="952" class="muted small">暫停唔代表本次更新已完成。</text><rect x="28" y="995" width="1184" height="148" rx="12" fill="#181825" stroke="#45475A"/><text x="48" y="1030" class="h">已停止</text><text x="48" y="1064" class="muted">取消及檔案收尾已完成；已保存檔案保留，唔會再自動繼續。</text><text x="48" y="1097" class="muted small">之後重新按更新會重新核對來源，已有完整檔案會跳過。</text><rect x="1008" y="1046" width="182" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="1020" y="1070" class="">返回帳戶清單</text><text x="28" y="1190" class="h">控制項狀態預覽</text><rect x="28" y="1210" width="152" height="36" rx="8" fill="#FF007F"/><text x="40" y="1234" class="button-primary">主要操作</text><rect x="197" y="1210" width="152" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="209" y="1234" class="">一般按鈕</text><rect x="366" y="1210" width="152" height="36" rx="8" fill="#45475A" stroke="#45475A"/><text x="378" y="1234" class="">滑鼠移入</text><rect x="535" y="1210" width="152" height="36" rx="8" fill="#262637" stroke="#45475A"/><text x="547" y="1234" class="">按下狀態</text><rect x="701" y="1207" width="158" height="42" rx="11" fill="none" stroke="#FF007F"/><rect x="704" y="1210" width="152" height="36" rx="8" fill="#313244" stroke="#45475A"/><text x="716" y="1234" class="">鍵盤焦點</text><rect x="873" y="1210" width="152" height="36" rx="8" fill="#313244"/><text x="885" y="1234" class="disabled">停用按鈕</text><text x="28" y="1300" class="muted small">已選選項用框線＋底色＋標記區分；錯誤亦有文字，唔單靠紅綠色。</text><text x="28" y="1334" class="muted small">支援鍵盤與減少動態效果；執行時鎖定帳戶／範圍／路徑編輯。</text><text x="28" y="1368" class="muted small">沒有排程，開啟 app 或登入成功都唔會自動啟動備份。</text><path d="M24 1441h1192" stroke="#45475A"/><text x="28" y="1465" class="muted small">設計示例 · 所有數字與狀態均為示意，唔代表已實測 · 香港時間 UTC+08:00</text></svg>