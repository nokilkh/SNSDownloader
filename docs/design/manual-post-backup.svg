<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="title">
  <title id="title">備份帳戶頁的貼文連結輸入與結果明細</title>
  <style>
    text { font: 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; fill: #CDD6F4; }
    .heading { font-size: 20px; font-weight: 650; }
    .hint { fill: #A6ADC8; font-size: 13px; }
    .warning { fill: #F9E2AF; font-size: 14px; }
    .primary { fill: #11111B; font-weight: 650; }
    .count { font-size: 22px; font-weight: 650; }
    .panel { fill: #181825; stroke: #45475A; }
    .control { fill: #313244; stroke: #45475A; }
  </style>
  <rect width="920" height="490" rx="14" fill="#1E1E2E"/>
  <rect class="panel" x="24" y="24" width="872" height="149" rx="12"/>
  <text class="heading" x="44" y="57">貼上連結備份</text>
  <text class="hint" x="44" y="87">X、Instagram 或 TikTok 原文連結</text>
  <rect x="44" y="98" width="681" height="39" rx="8" fill="#1E1E2E" stroke="#FF007F"/>
  <text x="57" y="123">https://www.tiktok.com/@sample/photo/1234567890</text>
  <rect x="737" y="98" width="139" height="39" rx="8" fill="#FF007F"/>
  <text class="primary" x="806.5" y="123" text-anchor="middle">備份呢篇貼文</text>
  <text class="hint" x="44" y="156">存入目前嘅備份位置，已保存嘅完整媒體會跳過。</text>

  <rect class="panel" x="24" y="191" width="872" height="275" rx="12"/>
  <text class="heading" x="44" y="224">@sample · 查看結果</text>
  <g class="metrics">
    <text class="hint" x="44" y="253">新增貼文（篇）</text><text class="count" x="44" y="278">2</text>
    <text class="hint" x="184" y="253">跳過媒體（檔）</text><text class="count" x="184" y="278">0</text>
    <text class="hint" x="324" y="253">文字／ALT 更新（篇）</text><text class="count" x="324" y="278">0</text>
    <text class="hint" x="464" y="253">畫質升級（檔）</text><text class="count" x="464" y="278">0</text>
    <text class="hint" x="604" y="253">失敗項目（個）</text><text class="count" x="604" y="278">1</text>
    <text class="hint" x="744" y="253">受限項目（個）</text><text class="count" x="744" y="278">2</text>
  </g>
  <text class="warning" x="44" y="308">相片清單未能完整讀取，未列出嘅貼文冇原文連結。</text>
  <path d="M44 322H876" stroke="#45475A"/>
  <text x="44" y="348" font-weight="650">失敗同受限嘅貼文</text>
  <text x="44" y="380">https://www.tiktok.com/@sample/photo/1234567890</text>
  <text class="warning" x="44" y="400">1 個項目失敗</text>
  <rect class="control" x="698" y="363" width="84" height="32" rx="8"/>
  <text x="740" y="385" text-anchor="middle">開啟原文</text>
  <rect class="control" x="792" y="363" width="84" height="32" rx="8"/>
  <text x="834" y="385" text-anchor="middle">複製連結</text>
  <path d="M44 411H876" stroke="#45475A"/>
  <text x="44" y="437">https://www.tiktok.com/@sample/video/1234567891</text>
  <text class="warning" x="44" y="456">1 個項目受限</text>
  <rect class="control" x="698" y="419" width="84" height="32" rx="8"/>
  <text x="740" y="441" text-anchor="middle">開啟原文</text>
  <rect class="control" x="792" y="419" width="84" height="32" rx="8"/>
  <text x="834" y="441" text-anchor="middle">複製連結</text>
</svg>
